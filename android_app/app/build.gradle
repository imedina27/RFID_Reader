plugins {
    id 'com.android.application'
    // Sin plugin de Kotlin: AGP 9+ ya trae soporte de Kotlin integrado.
}

android {
    namespace 'com.quantumlabs.rfidreader'
    compileSdk 36

    defaultConfig {
        applicationId "com.quantumlabs.rfidreader"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Wrapper SDK de la lectora CS108-2 (docs/apk.md, docs/lectora.md)
    implementation 'com.github.cslrfid.cs710s-android:csl-rfid-android-sdk:1.1.0'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 4.12.0, no 5.x: la rama 5 exige compileSdk 37+ y aqui usamos 36 (igual que el SDK de la lectora)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
